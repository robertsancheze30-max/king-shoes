<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>Panel King Shoes</title>
<meta name="theme-color" content="#14183a">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Figtree:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--ink:#14183a;--ink-soft:#5a5f7d;--paper:#f3f5f9;--gold:#b8902f;--line:#dfe3ee;--red:#c0392b;--ok:#1a9d4f}
*{box-sizing:border-box;margin:0}
body{font-family:'Figtree',system-ui,sans-serif;background:var(--paper);color:var(--ink);padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
header{background:var(--ink);color:#fff;padding:16px 18px;display:flex;justify-content:space-between;align-items:center;gap:12px}
header h1{font-family:'Bricolage Grotesque',sans-serif;font-size:22px;font-weight:800}
header a,header button{color:#d9dcef;font:inherit;font-size:14px;background:none;border:0;text-decoration:underline;cursor:pointer}
.wrap{max-width:640px;margin:0 auto;padding:16px 14px 60px;display:flex;flex-direction:column;gap:16px}
section{background:#fff;border:1px solid var(--line);border-radius:16px;padding:16px}
h2{font-family:'Bricolage Grotesque',sans-serif;font-size:19px;margin-bottom:12px}
label{display:block;font-size:14px;font-weight:600;margin:12px 0 5px}
input[type=text],input[type=email],input[type=password]{width:100%;padding:12px 14px;border:1px solid var(--line);border-radius:10px;font:inherit;font-size:16px;color:var(--ink);background:#fff}
input:focus{outline:2px solid var(--gold);outline-offset:1px}
.hint{font-size:13px;color:var(--ink-soft);margin-top:4px}
.btn{display:block;width:100%;margin-top:16px;padding:14px;border:0;border-radius:12px;background:var(--ink);color:#fff;font:inherit;font-weight:600;font-size:16px;cursor:pointer}
.btn:disabled{opacity:.5}
.btn.alt{background:#fff;color:var(--ink);border:1px solid var(--ink);margin-top:10px}
.pick{display:flex;align-items:center;justify-content:center;gap:8px;border:2px dashed var(--line);border-radius:12px;padding:18px;text-align:center;cursor:pointer;color:var(--ink-soft)}
.pick input{display:none}
#preview{display:none;width:100%;aspect-ratio:1/1;object-fit:cover;border-radius:12px;margin-top:10px}
.msg{margin-top:12px;font-size:14px;font-weight:600;min-height:20px}
.msg.ok{color:var(--ok)}.msg.err{color:var(--red)}
.items{display:flex;flex-direction:column;gap:10px}
.item{display:flex;gap:12px;align-items:center;border:1px solid var(--line);border-radius:12px;padding:8px}
.item img{width:64px;height:64px;object-fit:cover;border-radius:8px;flex:none}
.item .t{flex:1;min-width:0}
.item .t b{display:block;font-size:15px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.item .t span{font-size:13px;color:var(--ink-soft)}
.del{border:1px solid var(--red);color:var(--red);background:#fff;border-radius:10px;padding:9px 12px;font:inherit;font-size:14px;cursor:pointer}
.phone{display:grid;grid-template-columns:1fr 1.4fr auto;gap:8px;margin-bottom:8px}
.empty{color:var(--ink-soft);font-size:14px;padding:8px 0}
[hidden]{display:none!important}
</style>
</head>
<body>

<section id="login" class="wrap" style="margin-top:40px" hidden>
  <h2>Entrar al panel</h2>
  <label for="email">Correo</label>
  <input id="email" type="email" autocomplete="username" inputmode="email">
  <label for="pass">Contraseña</label>
  <input id="pass" type="password" autocomplete="current-password">
  <button class="btn" id="loginBtn">Entrar</button>
  <div class="msg err" id="loginMsg"></div>
</section>

<div id="panel" hidden>
  <header>
    <h1>King Shoes · Panel</h1>
    <div><a href="./index.html" target="_blank">Ver catálogo</a> &nbsp; <button id="logout">Salir</button></div>
  </header>
  <div class="wrap">

    <section>
      <h2>Subir zapato</h2>
      <label class="pick" for="file"><span id="pickText">Elegir foto de la galería</span><input id="file" type="file" accept="image/*"></label>
      <img id="preview" alt="Vista previa">
      <label for="pname">Nombre del zapato</label>
      <input id="pname" type="text" placeholder="Ej: Nike Air Max negro">
      <label for="psizes">Tallas disponibles (opcional)</label>
      <input id="psizes" type="text" placeholder="Ej: 38 al 43">
      <button class="btn" id="addBtn">Publicar zapato</button>
      <div class="msg" id="addMsg"></div>
    </section>

    <section>
      <h2>Zapatos publicados</h2>
      <div class="items" id="items"><div class="empty">Cargando…</div></div>
    </section>

    <section>
      <h2>Ajustes</h2>
      <label for="sname">Nombre del catálogo</label>
      <input id="sname" type="text">
      <label for="snotice">Aviso en el catálogo</label>
      <input id="snotice" type="text">
      <label>Números de WhatsApp</label>
      <div id="phones"></div>
      <div class="hint">Con código de país y sin signos. Ej: 56984237624. Cada número será un botón.</div>
      <button class="btn alt" id="addPhone">Agregar número</button>
      <button class="btn" id="saveCfg">Guardar ajustes</button>
      <div class="msg" id="cfgMsg"></div>
    </section>

  </div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getAuth, signInWithEmailAndPassword, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import { getDatabase, ref, onValue, push, set, remove } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";

const firebaseConfig = {
  apiKey: "AIzaSyD2LyDzzHEsiLNu0MhJ2PPRqPScIgGtbGM",
  authDomain: "king-shoes-a3969.firebaseapp.com",
  databaseURL: "https://king-shoes-a3969-default-rtdb.firebaseio.com",
  projectId: "king-shoes-a3969",
  storageBucket: "king-shoes-a3969.firebasestorage.app",
  messagingSenderId: "298453291461",
  appId: "1:298453291461:web:aa4896ea3b70cdd9bdfbac"
};
const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getDatabase(app);
const $ = id => document.getElementById(id);
const DEFAULT = {
  name: "King Shoes",
  notice: "Precio según modelo, talla y peso. Se cotiza por WhatsApp y se confirma con un abono del 50%.",
  phones: [{ label: "WhatsApp", number: "56984237624" }]
};
let started = false, photoData = null;

function say(id, text, kind){ const el = $(id); el.textContent = text; el.className = 'msg ' + (kind || ''); }

/* ---------- Login ---------- */
onAuthStateChanged(auth, user => {
  $('login').hidden = !!user;
  $('panel').hidden = !user;
  if(user && !started){ started = true; start(); }
});
async function doLogin(){
  say('loginMsg', '', '');
  try{ await signInWithEmailAndPassword(auth, $('email').value.trim(), $('pass').value); }
  catch(e){ say('loginMsg', 'Correo o contraseña incorrectos. Revisa e inténtalo de nuevo.', 'err'); }
}
$('loginBtn').addEventListener('click', doLogin);
$('pass').addEventListener('keydown', e => { if(e.key === 'Enter') doLogin(); });
$('logout').addEventListener('click', () => signOut(auth));

/* ---------- Fotos ---------- */
function compress(file, max = 900, quality = 0.72){
  return new Promise((resolve, reject) => {
    const img = new Image(), url = URL.createObjectURL(file);
    img.onload = () => {
      const s = Math.min(1, max / Math.max(img.width, img.height));
      const w = Math.round(img.width * s), h = Math.round(img.height * s);
      const c = document.createElement('canvas'); c.width = w; c.height = h;
      c.getContext('2d').drawImage(img, 0, 0, w, h);
      URL.revokeObjectURL(url);
      resolve(c.toDataURL('image/jpeg', quality));
    };
    img.onerror = () => reject(new Error('No se pudo leer la foto'));
    img.src = url;
  });
}
$('file').addEventListener('change', async e => {
  const f = e.target.files[0]; if(!f) return;
  try{
    photoData = await compress(f);
    $('preview').src = photoData; $('preview').style.display = 'block';
    $('pickText').textContent = 'Cambiar foto';
    say('addMsg', '', '');
  }catch(err){ photoData = null; say('addMsg', 'No se pudo leer esa foto. Prueba con otra.', 'err'); }
});

/* ---------- Zapatos ---------- */
$('addBtn').addEventListener('click', async () => {
  const name = $('pname').value.trim();
  if(!photoData){ return say('addMsg', 'Falta la foto del zapato.', 'err'); }
  if(!name){ return say('addMsg', 'Falta el nombre del zapato.', 'err'); }
  $('addBtn').disabled = true; say('addMsg', 'Publicando…', '');
  try{
    await set(push(ref(db, 'products')), { name, sizes: $('psizes').value.trim(), photo: photoData, createdAt: Date.now() });
    $('pname').value = ''; $('psizes').value = ''; $('file').value = ''; photoData = null;
    $('preview').style.display = 'none'; $('pickText').textContent = 'Elegir foto de la galería';
    say('addMsg', 'Zapato publicado.', 'ok');
  }catch(err){ say('addMsg', 'No se pudo publicar. Revisa tu conexión e inténtalo otra vez.', 'err'); }
  $('addBtn').disabled = false;
});

function renderItems(map){
  const box = $('items'); box.innerHTML = '';
  const list = Object.entries(map || {}).map(([id, p]) => ({ id, ...p })).sort((a, b) => (b.createdAt || 0) - (a.createdAt || 0));
  if(!list.length){ box.innerHTML = '<div class="empty">Aún no has publicado zapatos.</div>'; return; }
  for(const p of list){
    const row = document.createElement('div'); row.className = 'item';
    const img = document.createElement('img'); img.src = p.photo; img.alt = '';
    const t = document.createElement('div'); t.className = 't';
    const b = document.createElement('b'); b.textContent = p.name;
    const s = document.createElement('span'); s.textContent = p.sizes ? 'Tallas: ' + p.sizes : 'Sin tallas';
    t.append(b, s);
    const del = document.createElement('button'); del.className = 'del'; del.textContent = 'Borrar';
    del.addEventListener('click', async () => {
      if(!confirm('¿Borrar "' + p.name + '" del catálogo?')) return;
      try{ await remove(ref(db, 'products/' + p.id)); }catch(e){ alert('No se pudo borrar. Inténtalo otra vez.'); }
    });
    row.append(img, t, del); box.append(row);
  }
}

/* ---------- Ajustes ---------- */
function phoneRow(ph = { label: '', number: '' }){
  const row = document.createElement('div'); row.className = 'phone';
  const l = document.createElement('input'); l.type = 'text'; l.placeholder = 'Nombre'; l.value = ph.label || '';
  const n = document.createElement('input'); n.type = 'text'; n.placeholder = '56912345678'; n.inputMode = 'tel'; n.value = ph.number || '';
  const x = document.createElement('button'); x.className = 'del'; x.textContent = 'Quitar';
  x.addEventListener('click', () => row.remove());
  row.append(l, n, x); $('phones').append(row);
}
$('addPhone').addEventListener('click', () => phoneRow());
$('saveCfg').addEventListener('click', async () => {
  const phones = [...$('phones').children].map(r => {
    const [l, n] = r.querySelectorAll('input');
    return { label: l.value.trim(), number: n.value.replace(/\D/g, '') };
  }).filter(p => p.number);
  if(!phones.length){ return say('cfgMsg', 'Agrega al menos un número de WhatsApp.', 'err'); }
  const cfg = { name: $('sname').value.trim() || DEFAULT.name, notice: $('snotice').value.trim(), phones };
  try{ await set(ref(db, 'config'), cfg); say('cfgMsg', 'Ajustes guardados.', 'ok'); }
  catch(e){ say('cfgMsg', 'No se pudo guardar. Inténtalo otra vez.', 'err'); }
});

function start(){
  onValue(ref(db, 'products'), s => renderItems(s.val()));
  onValue(ref(db, 'config'), s => {
    const v = s.val() || DEFAULT;
    $('sname').value = v.name || DEFAULT.name;
    $('snotice').value = v.notice ?? DEFAULT.notice;
    $('phones').innerHTML = '';
    const phones = Object.values(v.phones || {});
    (phones.length ? phones : DEFAULT.phones).forEach(phoneRow);
  }, { onlyOnce: true });
}
</script>
</body>
</html>
