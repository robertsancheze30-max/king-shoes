<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>King Shoes</title>
<meta name="description" content="Catálogo de zapatos King Shoes. Encarga desde Chile hacia Venezuela.">
<meta name="theme-color" content="#050505">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Figtree:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#14183a; --ink-soft:#5a5f7d; --paper:#f3f5f9; --card:#ffffff;
  --gold:#b8902f; --wa:#1a9d4f; --wa-dark:#13803f; --line:#dfe3ee;
}
*{box-sizing:border-box;margin:0}
html{-webkit-text-size-adjust:100%}
body{font-family:'Figtree',system-ui,-apple-system,sans-serif;background:var(--paper);color:var(--ink);padding-bottom:env(safe-area-inset-bottom)}
header{background:#050505;padding-top:env(safe-area-inset-top)}
.hero{display:block;width:100%;max-width:980px;height:auto;margin:0 auto}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.tools{padding:16px 14px 6px;max-width:980px;margin:0 auto}
.tools input{width:100%;padding:13px 16px;border:1px solid var(--line);border-radius:12px;font:inherit;font-size:16px;background:#fff;color:var(--ink)}
.tools input:focus{outline:2px solid var(--gold);outline-offset:1px}
main{max-width:980px;margin:0 auto;padding:10px 14px 40px}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}
@media(min-width:700px){.grid{grid-template-columns:repeat(3,1fr);gap:18px}}
.card{background:var(--card);border-radius:16px;overflow:hidden;display:flex;flex-direction:column;border:1px solid var(--line)}
.photo-btn{position:relative;display:block;width:100%;padding:0;border:0;background:#fff;cursor:pointer}
.photo{display:block;width:100%;aspect-ratio:1/1;object-fit:contain;background:#fff}
.badge{position:absolute;right:8px;bottom:8px;background:rgba(5,5,5,.78);color:#fff;font-size:12px;font-weight:600;padding:4px 9px;border-radius:99px}
.info{padding:12px 12px 14px;display:flex;flex-direction:column;gap:8px;flex:1;border-top:1px solid var(--line)}
.name{font-family:'Bricolage Grotesque',sans-serif;font-weight:600;font-size:17px;line-height:1.2}
.sizes{font-size:13px;color:var(--ink-soft)}
.btns{display:flex;flex-direction:column;gap:6px;margin-top:auto}
.order{display:block;text-align:center;text-decoration:none;background:var(--wa);color:#fff;font-weight:600;font-size:14px;padding:11px 8px;border-radius:10px}
.order:active{background:var(--wa-dark)}
.order:focus-visible,.photo-btn:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.state{text-align:center;color:var(--ink-soft);padding:48px 16px;line-height:1.5}
footer{text-align:center;color:var(--ink-soft);font-size:13px;padding:0 16px 28px}

/* Visor de fotos */
#viewer{position:fixed;inset:0;z-index:10;background:#0b0b0e;display:none;flex-direction:column;padding-top:env(safe-area-inset-top);padding-bottom:env(safe-area-inset-bottom)}
#viewer.on{display:flex}
.vbar{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 14px;color:#fff}
.vtitle{font-family:'Bricolage Grotesque',sans-serif;font-weight:600;font-size:17px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#vClose{flex:none;width:42px;height:42px;border-radius:50%;border:1px solid #444;background:#1a1a20;color:#fff;font-size:24px;line-height:1;cursor:pointer}
#vTrack{flex:1;min-height:0;display:flex;overflow-x:auto;scroll-snap-type:x mandatory;-webkit-overflow-scrolling:touch;touch-action:pan-x pinch-zoom;scrollbar-width:none}
#vTrack::-webkit-scrollbar{display:none}
.slide{flex:0 0 100%;scroll-snap-align:center;display:flex;align-items:center;justify-content:center;padding:4px 8px}
.slide img{max-width:100%;max-height:100%;object-fit:contain;border-radius:8px}
.vfoot{padding:10px 14px 14px;display:flex;flex-direction:column;gap:8px}
#vCount{text-align:center;color:#b9bdd8;font-size:13px}
#vBtns{display:flex;flex-direction:column;gap:6px}
</style>
</head>
<body>
<header>
  <h1 id="storeName" class="sr">King Shoes</h1>
  <img class="hero" src="header.jpg" alt="King Shoes: zapatillas con corona dorada" width="1400" height="788">
</header>
<div class="notice">Se cotiza por WhatsApp y se encarga con un abono del 50%.</div>
<div class="tools"><input id="search" type="search" placeholder="Buscar zapato" aria-label="Buscar zapato"></div>
<main>
  <div class="grid" id="grid"></div>
  <div class="state" id="state">Cargando zapatos…</div>
</main>
<footer>Los precios se cotizan por WhatsApp.</footer>

<div id="viewer" role="dialog" aria-modal="true" aria-label="Fotos del zapato">
  <div class="vbar"><div class="vtitle" id="vTitle"></div><button id="vClose" aria-label="Cerrar">×</button></div>
  <div id="vTrack"></div>
  <div class="vfoot"><div id="vCount"></div><div id="vBtns"></div></div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getDatabase, ref, onValue, get } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";

const firebaseConfig = {
  apiKey: "AIzaSyD2LyDzzHEsiLNu0MhJ2PPRqPScIgGtbGM",
  authDomain: "king-shoes-a3969.firebaseapp.com",
  databaseURL: "https://king-shoes-a3969-default-rtdb.firebaseio.com",
  projectId: "king-shoes-a3969",
  storageBucket: "king-shoes-a3969.firebasestorage.app",
  messagingSenderId: "298453291461",
  appId: "1:298453291461:web:aa4896ea3b70cdd9bdfbac"
};
const db = getDatabase(initializeApp(firebaseConfig));

const DEFAULT = {
  name: "King Shoes",
  phones: [{ label: "WhatsApp", number: "56984237624" }]
};
let config = DEFAULT, products = [], loaded = false, query = "";
const $ = id => document.getElementById(id);

function waLink(number, name){
  const msg = `Hola, quiero encargar: ${name}, talla ___. ¿Me cotizas?`;
  return `https://wa.me/${String(number).replace(/\D/g,'')}?text=${encodeURIComponent(msg)}`;
}
function orderButtons(p){
  const frag = document.createDocumentFragment();
  const phones = config.phones.length ? config.phones : DEFAULT.phones;
  for(const ph of phones){
    const a = document.createElement('a'); a.className = 'order';
    a.href = waLink(ph.number, p.name); a.target = '_blank'; a.rel = 'noopener';
    a.textContent = phones.length > 1 ? `Encargar · ${ph.label || ph.number}` : "Encargar por WhatsApp";
    frag.append(a);
  }
  return frag;
}
const coverOf = p => p.cover || p.photo;
const countOf = p => p.count || 1;

function renderHead(){
  $('storeName').textContent = config.name;
  document.title = config.name;
}

function renderGrid(){
  const grid = $('grid'), state = $('state');
  grid.innerHTML = "";
  const q = query.trim().toLowerCase();
  const list = products.filter(p => !q || (p.name||"").toLowerCase().includes(q));
  if(!loaded){ state.hidden = false; state.textContent = "Cargando zapatos…"; return; }
  if(!list.length){
    state.hidden = false;
    state.textContent = products.length ? "No encontramos ese zapato. Prueba con otra palabra." : "Pronto subiremos los zapatos disponibles. Vuelve en un rato.";
    return;
  }
  state.hidden = true;
  for(const p of list){
    const card = document.createElement('article'); card.className = 'card';
    const btn = document.createElement('button'); btn.className = 'photo-btn'; btn.type = 'button';
    btn.setAttribute('aria-label', 'Ver fotos de ' + p.name);
    const img = document.createElement('img'); img.className = 'photo'; img.loading = 'lazy';
    img.src = coverOf(p); img.alt = p.name || "Zapato";
    btn.append(img);
    if(countOf(p) > 1){ const b = document.createElement('span'); b.className = 'badge'; b.textContent = countOf(p) + ' fotos'; btn.append(b); }
    btn.addEventListener('click', () => openViewer(p));
    const info = document.createElement('div'); info.className = 'info';
    const name = document.createElement('div'); name.className = 'name'; name.textContent = p.name;
    info.append(name);
    if(p.sizes){ const s = document.createElement('div'); s.className = 'sizes'; s.textContent = "Tallas: " + p.sizes; info.append(s); }
    const btns = document.createElement('div'); btns.className = 'btns'; btns.append(orderButtons(p));
    info.append(btns);
    card.append(btn, info);
    grid.append(card);
  }
}

/* ---------- Visor de fotos ---------- */
let viewing = null;
function slides(urls){
  const track = $('vTrack'); track.innerHTML = '';
  urls.forEach((u, i) => {
    const s = document.createElement('div'); s.className = 'slide';
    const im = document.createElement('img'); im.src = u; im.alt = (viewing ? viewing.name : '') + ' foto ' + (i + 1);
    s.append(im); track.append(s);
  });
  track.scrollLeft = 0; updateCount();
}
function updateCount(){
  const t = $('vTrack'), n = t.children.length;
  const i = Math.min(n - 1, Math.round(t.scrollLeft / (t.clientWidth || 1)));
  $('vCount').textContent = n > 1 ? `${i + 1} de ${n} · desliza para ver más` : '';
}
async function openViewer(p){
  viewing = p;
  $('vTitle').textContent = p.name;
  $('vBtns').innerHTML = ''; $('vBtns').append(orderButtons(p));
  slides([coverOf(p)]);
  $('viewer').classList.add('on'); document.body.style.overflow = 'hidden';
  if(countOf(p) > 1){
    try{
      const s = await get(ref(db, 'photos/' + p.id));
      const arr = Object.values(s.val() || {});
      if(arr.length && viewing === p) slides(arr);
    }catch(e){}
  }
}
function closeViewer(){ $('viewer').classList.remove('on'); document.body.style.overflow = ''; viewing = null; }
$('vClose').addEventListener('click', closeViewer);
$('vTrack').addEventListener('scroll', updateCount, { passive: true });
document.addEventListener('keydown', e => { if(e.key === 'Escape') closeViewer(); });

/* ---------- Datos ---------- */
onValue(ref(db, "config"), snap => {
  const v = snap.val();
  if(v){
    const phones = Object.values(v.phones || {}).filter(p => p && p.number);
    config = { name: v.name || DEFAULT.name, phones: phones.length ? phones : DEFAULT.phones };
  } else config = DEFAULT;
  renderHead(); renderGrid();
});

onValue(ref(db, "products"), snap => {
  const v = snap.val() || {};
  products = Object.entries(v).map(([id, p]) => ({ id, ...p })).filter(p => coverOf(p) && p.name)
    .sort((a, b) => (b.createdAt || 0) - (a.createdAt || 0));
  loaded = true; renderGrid();
}, () => { loaded = true; products = []; $('state').textContent = "No pudimos cargar el catálogo. Revisa tu conexión e inténtalo de nuevo."; });

$('search').addEventListener('input', e => { query = e.target.value; renderGrid(); });
renderHead();
</script>
</body>
</html>
